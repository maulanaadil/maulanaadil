<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Goofy animated Gundam-style mobile suit</title>
  <desc id="desc">A little red, white, and blue robot bobs and waves hello beneath a silly greeting.</desc>
  <defs>
    <style>
      .bot { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.8s ease-in-out infinite; }
      .waving-arm { transform-box: fill-box; transform-origin: 50% 12%; animation: wave .75s ease-in-out infinite alternate; }
      .spark { transform-box: fill-box; transform-origin: center; animation: sparkle 1.3s ease-in-out infinite; }
      .spark.delay { animation-delay: .6s; }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
      @keyframes wave { from { transform: rotate(-15deg); } to { transform: rotate(-62deg); } }
      @keyframes sparkle { 0%,100% { opacity: .25; transform: scale(.7) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(22deg); } }
      @media (prefers-reduced-motion: reduce) { .bot,.waving-arm,.spark { animation: none; } }
    </style>
  </defs>
  <rect width="640" height="360" rx="28" fill="#e9f5ff"/>
  <circle cx="548" cy="66" r="34" fill="#ffd166"/>
  <path d="M0 294 Q160 262 320 294 T640 282 V360 H0Z" fill="#b7e4c7"/>
  <text x="38" y="58" fill="#19324d" font-family="Verdana,sans-serif" font-size="25" font-weight="700">HELLO, INTERNET!</text>
  <text x="40" y="84" fill="#547086" font-family="Verdana,sans-serif" font-size="14">A tiny mobile suit has entered the chat.</text>
  <g class="spark" fill="#e6a822" font-family="Verdana,sans-serif" font-size="34" font-weight="700"><text x="174" y="177">✦</text></g>
  <g class="spark delay" fill="#e6a822" font-family="Verdana,sans-serif" font-size="40" font-weight="700"><text x="421" y="153">✧</text></g>
  <g class="bot" stroke="#263449" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M278 248 L271 295 Q270 307 282 307 H305 Q315 306 312 295 L309 251Z" fill="#f5f0dc"/>
    <path d="M331 250 L329 295 Q328 307 340 307 H364 Q375 305 369 293 L360 247Z" fill="#f5f0dc"/>
    <path d="M271 292h41v12h-42zM329 292h43v12h-43z" fill="#386ab3"/>
    <path d="M267 174 Q270 161 284 160 H354 Q369 162 372 176 L365 248 Q320 263 274 248Z" fill="#f5f0dc"/>
    <path d="M269 181h22v61h-24z" fill="#e84a45"/>
    <path d="M350 181h22v61h-25z" fill="#386ab3"/>
    <path d="M296 179h47l-7 36-17 13-17-13z" fill="#f3bb35"/>
    <circle cx="320" cy="239" r="7" fill="#263449" stroke="none"/>
    <path d="M308 151h25v18h-25z" fill="#68778c"/>
    <path d="M269 178 Q250 177 242 195 L229 231 Q225 242 237 247 L247 251 Q258 253 263 240 L282 203Z" fill="#e84a45"/>
    <g class="waving-arm">
      <path d="M366 177 Q386 169 398 184 L416 213 Q423 224 412 232 L402 239 Q391 243 384 231 L363 204Z" fill="#386ab3"/>
      <path d="M411 222 Q421 213 430 222 L438 231 Q442 239 434 244 L426 250 Q419 253 414 246 L407 237Z" fill="#f5f0dc"/>
    </g>
    <path d="M289 111 Q291 99 303 98 H338 Q350 100 352 112 L348 153 H293Z" fill="#f5f0dc"/>
    <path d="M294 119 Q320 108 347 119 L345 131 Q320 126 295 132Z" fill="#263449" stroke="none"/>
    <path d="M299 122h38" stroke="#ff5b50" stroke-width="6"/>
    <path d="M305 137h29l-5 18h-19z" fill="#d5d9df"/>
    <path d="M317 104 L299 74 L307 69 L322 91 L338 68 L346 73 L328 105Z" fill="#ffcf47"/>
  </g>
  <text x="442" y="237" fill="#19324d" font-family="Verdana,sans-serif" font-size="19" font-weight="700" transform="rotate(8 442 237)">WAVE!</text>
  <text x="444" y="258" fill="#547086" font-family="Verdana,sans-serif" font-size="13" transform="rotate(8 444 258)">(politely)</text>
</svg>
